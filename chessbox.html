<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 600px;
            height: 600px;
            border: 2px solid rgb(16, 16, 16);
            display: grid;
            grid-template-columns: repeat(4,2fr); 
            /* fr for remaining space  */
            grid-template-rows:repeat(4,2fr);
         
            
        }
        .black{
            /* width: 50px;
            height: 50px; */
            border: 2px solid black;
            background-color: rgb(17, 17, 16);

        }
        .white{
            /* width: 50px;
            height: 50px; */
            border: 2px solid rgb(235, 229, 229);
            background-color: rgb(252, 252, 248);

        }
        .black:hover{
            background-color: pink;
        }
        .white:hover{
    background-color: red;
}
    </style>
</head>
<body>
<div class="box">

    <div class="black"></div>
    <div class="white"></div>
    <div class="black"></div>
    <div class="white"></div>

    <div class="white"></div>
    <div class="black"></div>
    <div class="white"></div>
    <div class="black"></div>

   
    <div class="black"></div>
    <div class="white"></div>
    <div class="black"></div>
    <div class="white"></div>

   
    <div class="white"></div>
    <div class="black"></div>
    <div class="white"></div>
    <div class="black"></div>
</div>

</body>
</html>
